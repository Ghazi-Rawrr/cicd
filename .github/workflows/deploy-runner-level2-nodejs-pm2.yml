name: "Skenario 2 - Level 2 - Deploy Node.js pm2 (self-hosted VM-B)"

on:
  push: # Ubah ke push agar otomatis deploy saat commit
    branches: [ main ]
    paths:
      - 'skenario2-self-hosted-runner/level2-nodejs-pm2/app/**'
  workflow_dispatch:
    inputs:
      port:
        description: 'Port yang dipakai aplikasi'
        required: true
        default: '4100'

jobs:
  deploy:
    name: Deploy Node.js app (pm2) langsung di VM-B
    runs-on: [self-hosted, vm-b]
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Persiapkan direktori aplikasi
        run: |
          sudo mkdir -p /opt/level2-node-pm2
          sudo chown -R $USER:$USER /opt/level2-node-pm2

      - name: Salin file aplikasi (lokal, tanpa SSH)
        run: |
          cp skenario2-self-hosted-runner/level2-nodejs-pm2/app/server.js /opt/level2-node-pm2/
          cp skenario2-self-hosted-runner/level2-nodejs-pm2/app/package.json /opt/level2-node-pm2/

      - name: Install dependencies & (Re)start dengan pm2
        env:
          APP_PORT: ${{ github.event.inputs.port || '4100' }}
        run: |
          cd /opt/level2-node-pm2
          npm install
          
          # Gunakan npx pm2 agar runner dapat mengenali perintah pm2
          PORT=${APP_PORT} npx pm2 restart level2-node-pm2 --update-env || PORT=${APP_PORT} npx pm2 start server.js --name level2-node-pm2
          npx pm2 save
